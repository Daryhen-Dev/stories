# OpenSpec SDD configuration — stories
# Generated by sdd-init on 2026-09-12 for an empty repository.
# Sections under `sdd` mirror the session preflight; edit deliberately, never destructively.

project:
  name: stories
  description: >-
    Local-first product that lets a single operator manage the public stories of
    multiple projects/sites from an admin panel running on the operator's PC.
    Each managed project uses its own Supabase or InsForge credentials; Astro and
    Next.js sites consume media and a remote manifest published by the panel.
  repository_state: empty # no package.json, no source code, no tests yet

context:
  toolchain_available:
    node: v24.18.0
    pnpm: 11.3.0
  recommended_stack:
    workspace: pnpm monorepo
    language: TypeScript (strict)
    admin_ui: React + Vite (local panel on the operator's PC)
    local_api: Node + Fastify
    storage: SQLite via Drizzle ORM
    validation: Zod
    site_embed: Lit Web Component
    unit_tests: Vitest (planned, not yet installed)
    e2e_tests: Playwright (planned, not yet installed)
  constraints:
    - Local-first: the panel and its SQLite data stay on the operator's machine.
    - Single operator; no multi-tenant admin UI is in scope.
    - Each managed project keeps isolated Supabase/InsForge credentials; secrets
      must never be committed to the repository.
    - Consuming sites (Astro/Next.js) depend only on the remote manifest and media.

sdd:
  artifact_store: openspec
  execution_mode: auto
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
  chain_strategy: deferred # decided only when a review-budget risk appears
  strict_tdd: true

tdd:
  runner: vitest # planned; will be installed with the first work package
  e2e_runner: playwright # planned
  coverage_gate: none # no baseline exists in an empty repository
  evidence: >-
    Strict TDD (RED, GREEN, TRIANGULATE, REFACTOR) applies from the first
    implementation phase, once the runner lands. Until then, specs and tasks
    carry acceptance criteria; the toolchain setup is itself a task with a
    runnable test as its exit criterion.

phases:
  clarify: required before a proposal whenever scope or acceptance is ambiguous
  proposal: openspec/changes/<change-id>/proposal.md
  specs: openspec/changes/<change-id>/specs/ (delta specs per capability)
  design: openspec/changes/<change-id>/design.md (required for risky or multi-area work)
  tasks: openspec/changes/<change-id>/tasks.md (work units sized under the 400-line review budget)
  apply: progress is tracked inside tasks.md as units complete
  verify: openspec/changes/<change-id>/verify.md with test commands and evidence
  archive: completed changes move under openspec/changes/archive/
